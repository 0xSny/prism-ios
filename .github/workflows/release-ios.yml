name: Build & Release iOS Unsigned IPA

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-15-intel
    env:
      APP_VERSION: "1.1.6"
      BUILD_NUMBER: "1106"
      BUNDLE_ID: "com.zzaoo.prism.mobile"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
          xcodebuild -version

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned iOS App
        run: |
          xcodebuild \
            -project PrismMobile.xcodeproj \
            -scheme PrismMobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Verify AppIcon Compiled Inside Bundle
        run: |
          APP_DIR="build/Build/Products/Release-iphoneos/PrismMobile.app"
          ls -lh "$APP_DIR"
          test -f "$APP_DIR/Assets.car" || { echo "Missing Assets.car"; exit 1; }
          test -f "$APP_DIR/AppIcon60x60@2x.png" || { echo "Missing AppIcon60x60@2x.png"; exit 1; }
          test -f "$APP_DIR/easylist_adguard_cn.json" || { echo "Missing easylist_adguard_cn.json"; exit 1; }
          test -f "$APP_DIR/prism_annoyances_privacy.json" || { echo "Missing prism_annoyances_privacy.json"; exit 1; }

      - name: Package IPA & Generate Self-Sign repo.json
        run: |
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/PrismMobile.app dist/Payload/
          cd dist
          zip -r -y Prism-${APP_VERSION}.ipa Payload
          IPA_SIZE=$(wc -c < Prism-${APP_VERSION}.ipa | tr -d ' ')
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > repo.json <<EOF
          {
            "name": "Prism Official iOS Repo",
            "subtitle": "零知识云同步 · 多重隔离容器 · 自签轻量移动浏览器",
            "description": "Prism v${APP_VERSION} 无签名 IPA 软件源（兼容 ESign 轻松签 / OmniSign 全能签 / Feather / AltStore）",
            "iconURL": "https://prism.zzaoo.com/ios/icon.png",
            "website": "https://prism.zzaoo.com",
            "apps": [
              {
                "name": "Prism",
                "bundleIdentifier": "${BUNDLE_ID}",
                "developerName": "Prism Team",
                "subtitle": "零知识云同步与指纹容器隔离浏览器",
                "localizedDescription": "Prism v${APP_VERSION} 原生 SwiftUI 移动客户端：液态玻璃底部倒序悬浮 Omnibox、0ms 防闪白网页深色自愈引擎、四层防强跳 App 护盾、动态底栏避让与锁定屏媒体控制、书签历史云同步与 Tombstone 删除墓碑。",
                "iconURL": "https://prism.zzaoo.com/ios/icon.png",
                "tintColor": "#4285F4",
                "versions": [
                  {
                    "version": "${APP_VERSION}",
                    "buildVersion": "${BUILD_NUMBER}",
                    "date": "${BUILD_DATE}",
                    "size": ${IPA_SIZE},
                    "minOSVersion": "17.0",
                    "downloadURL": "https://prism.zzaoo.com/releases/Prism-${APP_VERSION}.ipa",
                    "localizedDescription": "v${APP_VERSION}：新增 PC ⇄ iOS 通用油猴/扩展脚本引擎（GM_info.prism、@prism-platform、WKContentWorld 隔离与 GM_* 桥接）、userscripts 零知识加密云同步与移动端脚本管理面板。"
                  }
                ]
              }
            ],
            "news": []
          }
          EOF
          ls -lh Prism-${APP_VERSION}.ipa repo.json
          cat repo.json

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prism-ios-v${{ env.APP_VERSION }}
          path: |
            dist/Prism-${{ env.APP_VERSION }}.ipa
            dist/repo.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Prism v${{ env.APP_VERSION }} (Unsigned IPA)
          body: |
            Prism v${{ env.APP_VERSION }} 无签名原生 `.ipa` 与 AltStore / ESign / OmniSign / Feather 软件源。
            - 新增：PC ⇄ iOS 通用油猴/扩展脚本引擎（`GM_info.prism`、`@prism-platform`、`WKContentWorld` 隔离、`GM_getValue`/`GM_setValue`/`GM_addStyle`/`GM_xmlhttpRequest` 桥接）、`userscripts` 零知识加密云同步与移动端脚本管理面板。
            - 模块一：液态玻璃底部倒序悬浮 Omnibox（实景渐晕背景、SERP 去重、Safari 反向加粗联想、零点击剪贴板隐私检测）。
            - 模块二~四：0ms 防闪白网页深色自愈引擎、动态底栏 `contentInset.bottom` 避让、视频接力精确秒数定位、按需音频会话与锁屏控制、分片 POST 并发翻译、原生弹窗与离线错误页、桌面视图切换。
            - 模块五~六：书签与历史管理面板、密码库 CRUD（滑动删除/新增/复制）、零知识加密 Tombstone 墓碑同步与弹窗切换时序修复。
            - 无受限权限（No restricted entitlements），完整实心 AppIcon，个人证书 / 自签工具直接安装。
            - 官方自签源 URL：`https://prism.zzaoo.com/ios/repo.json`
          files: |
            dist/Prism-${{ env.APP_VERSION }}.ipa
            dist/repo.json
