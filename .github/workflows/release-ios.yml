name: Build & Release iOS Unsigned IPA

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-15
    env:
      APP_VERSION: "0.6.0"
      BUNDLE_ID: "com.zzaoo.prism.mobile"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
          xcodebuild -version

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned iOS App
        run: |
          xcodebuild \
            -project PrismMobile.xcodeproj \
            -scheme PrismMobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package IPA & Generate Self-Sign repo.json
        run: |
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/PrismMobile.app dist/Payload/
          cd dist
          zip -r -y Prism-Mobile-${APP_VERSION}.ipa Payload
          IPA_SIZE=$(wc -c < Prism-Mobile-${APP_VERSION}.ipa | tr -d ' ')
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > repo.json <<EOF
          {
            "name": "Prism Browser Official iOS Repo",
            "subtitle": "零知识云同步 · 多重隔离容器 · 自签轻量移动浏览器",
            "description": "Prism Mobile v${APP_VERSION} 无签名 IPA 软件源（兼容 ESign 轻松签 / OmniSign 全能签 / Feather / AltStore）",
            "iconURL": "https://prism.zzaoo.com/assets/prism-logo-256.png",
            "website": "https://prism.zzaoo.com",
            "apps": [
              {
                "name": "Prism Browser",
                "bundleIdentifier": "${BUNDLE_ID}",
                "developerName": "Prism Team",
                "subtitle": "零知识云同步与指纹容器隔离浏览器",
                "localizedDescription": "Prism v0.6.0 原生 SwiftUI 移动客户端：3 秒云端同步（密码/书签/历史/快捷方式）、iOS 17 原生代理与隔离容器、2x 长按倍速与媒体嗅探保存到相册、App 强制跳转拦截与移动端 DevTools。",
                "iconURL": "https://prism.zzaoo.com/assets/prism-logo-256.png",
                "tintColor": "#4285F4",
                "versions": [
                  {
                    "version": "${APP_VERSION}",
                    "buildVersion": "600",
                    "date": "${BUILD_DATE}",
                    "size": ${IPA_SIZE},
                    "minOSVersion": "17.0",
                    "downloadURL": "https://prism.zzaoo.com/releases/Prism-Mobile-${APP_VERSION}.ipa",
                    "localizedDescription": "v0.6.0 首发版本：单手拇指操控、Face ID 密码库填充、零知识自动云同步、媒体嗅探与 Mobile DevTools。"
                  }
                ]
              }
            ],
            "news": []
          }
          EOF
          ls -lh Prism-Mobile-${APP_VERSION}.ipa repo.json
          cat repo.json

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prism-ios-v0.6.0
          path: |
            dist/Prism-Mobile-${{ env.APP_VERSION }}.ipa
            dist/repo.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.0
          name: Prism Mobile v0.6.0 (Unsigned IPA)
          body: |
            Prism Mobile v0.6.0 无签名原生 `.ipa` 与 AltStore / ESign / OmniSign / Feather 软件源。
            - 无受限权限（No restricted entitlements），个人证书 / 自签工具直接安装。
            - 官方自签源 URL：`https://prism.zzaoo.com/ios/repo.json`
          files: |
            dist/Prism-Mobile-0.6.0.ipa
            dist/repo.json
