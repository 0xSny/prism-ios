name: Build & Release iOS Unsigned IPA

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-15
    env:
      APP_VERSION: "0.7.0"
      BUNDLE_ID: "com.zzaoo.prism.mobile"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
          xcodebuild -version

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned iOS App
        run: |
          xcodebuild \
            -project PrismMobile.xcodeproj \
            -scheme PrismMobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Verify AppIcon Compiled Inside Bundle
        run: |
          APP_DIR="build/Build/Products/Release-iphoneos/PrismMobile.app"
          ls -lh "$APP_DIR"
          test -f "$APP_DIR/Assets.car" || { echo "Missing Assets.car"; exit 1; }
          test -f "$APP_DIR/AppIcon60x60@2x.png" || { echo "Missing AppIcon60x60@2x.png"; exit 1; }
          test -f "$APP_DIR/easylist_adguard_cn.json" || { echo "Missing easylist_adguard_cn.json"; exit 1; }

      - name: Package IPA & Generate Self-Sign repo.json
        run: |
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/PrismMobile.app dist/Payload/
          cd dist
          zip -r -y Prism-Mobile-${APP_VERSION}.ipa Payload
          IPA_SIZE=$(wc -c < Prism-Mobile-${APP_VERSION}.ipa | tr -d ' ')
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > repo.json <<EOF
          {
            "name": "Prism Browser Official iOS Repo",
            "subtitle": "零知识云同步 · 多重隔离容器 · 自签轻量移动浏览器",
            "description": "Prism Mobile v${APP_VERSION} 无签名 IPA 软件源（兼容 ESign 轻松签 / OmniSign 全能签 / Feather / AltStore）",
            "iconURL": "https://prism.zzaoo.com/ios/icon.png",
            "website": "https://prism.zzaoo.com",
            "apps": [
              {
                "name": "Prism Browser",
                "bundleIdentifier": "${BUNDLE_ID}",
                "developerName": "Prism Team",
                "subtitle": "零知识云同步与指纹容器隔离浏览器",
                "localizedDescription": "Prism v${APP_VERSION} 原生 SwiftUI 移动客户端：顶部下拉刷新、地址栏点击自动全选、实时天气胶囊、忘记主密码验证码找回、Face ID 密码库填充、iOS 17 代理隔离容器与媒体嗅探。",
                "iconURL": "https://prism.zzaoo.com/ios/icon.png",
                "tintColor": "#4285F4",
                "versions": [
                  {
                    "version": "${APP_VERSION}",
                    "buildVersion": "700",
                    "date": "${BUILD_DATE}",
                    "size": ${IPA_SIZE},
                    "minOSVersion": "17.0",
                    "downloadURL": "https://prism.zzaoo.com/releases/Prism-Mobile-${APP_VERSION}.ipa",
                    "localizedDescription": "v0.7.0：网页顶部下拉刷新、真图标 AppIcon 矩阵修复、地址栏自动全选+40pt 快捷键盘条、Open-Meteo 天气、全平台密码捕获与忘记密码找回。"
                  }
                ]
              }
            ],
            "news": []
          }
          EOF
          ls -lh Prism-Mobile-${APP_VERSION}.ipa repo.json
          cat repo.json

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prism-ios-v0.7.0
          path: |
            dist/Prism-Mobile-${{ env.APP_VERSION }}.ipa
            dist/repo.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.7.0
          name: Prism Mobile v0.7.0 (Unsigned IPA)
          body: |
            Prism Mobile v0.7.0 无签名原生 `.ipa` 与 AltStore / ESign / OmniSign / Feather 软件源。
            - 无受限权限（No restricted entitlements），完整实心 AppIcon，个人证书 / 自签工具直接安装。
            - 官方自签源 URL：`https://prism.zzaoo.com/ios/repo.json`
          files: |
            dist/Prism-Mobile-0.7.0.ipa
            dist/repo.json
