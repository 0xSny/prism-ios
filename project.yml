name: PrismMobile
options:
  bundleIdPrefix: com.zzaoo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  PrismMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/easylist_adguard_cn.json
      - path: Resources/prism_annoyances_privacy.json
    settings:
      base:
        PRODUCT_NAME: PrismMobile
        PRODUCT_BUNDLE_IDENTIFIER: com.zzaoo.prism.mobile
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: Prism
        MARKETING_VERSION: "1.1.6"
        CURRENT_PROJECT_VERSION: "1106"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        AD_HOC_CODE_SIGNING_ALLOWED: YES
        ENABLE_BITCODE: NO
